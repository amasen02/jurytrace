[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jurytrace"
version = "0.1.0"
description = "Evidence-gated disagreement tracing for agent regression judges"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ama Senevirathne"}]
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
jurytrace = "jurytrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jurytrace"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

